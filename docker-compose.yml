services:
  pixcape:
    build: .
    image: pixcape:latest
    container_name: pixcape
    restart: unless-stopped
    ports:
      - "${PIXELCAPE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
