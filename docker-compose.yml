services:
  pixcape:
    build:
      context: .
    image: ghcr.io/liseezn/pixcape:latest
    container_name: pixcape
    restart: unless-stopped
    ports:
      - "${PIXELCAPE_PORT:-8080}:80"
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_RATE_LIMIT_IP_HEADER: ${LOGIN_RATE_LIMIT_IP_HEADER:-x-real-ip}
      AI_ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS:-}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-auto}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_MAX_UPLOAD_MB: ${AI_MAX_UPLOAD_MB:-8}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODELS: ${GEMINI_IMAGE_MODELS:-gemini-2.5-flash-image}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODELS: ${OPENAI_IMAGE_MODELS:-gpt-image-1,gpt-image-1.5}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_IMAGE_MODELS: ${OPENROUTER_IMAGE_MODELS:-}
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-}
      OPENROUTER_IMAGE_TO_IMAGE_MODELS: ${OPENROUTER_IMAGE_TO_IMAGE_MODELS:-}
      OPENROUTER_IMAGE_TO_IMAGE_MODEL: ${OPENROUTER_IMAGE_TO_IMAGE_MODEL:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      SEEDREAM_IMAGE_MODELS: ${SEEDREAM_IMAGE_MODELS:-doubao-seedream-4-0-250828}
      SEEDREAM_IMAGE_MODEL: ${SEEDREAM_IMAGE_MODEL:-}
      SEEDREAM_IMAGE_SIZE: ${SEEDREAM_IMAGE_SIZE:-2K}
    volumes:
      - pixcape-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:3000/login'),fetch('http://127.0.0.1:8787/health')]).then(r=>process.exit(r.every(x=>x.status<500)?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  pixcape-data:
