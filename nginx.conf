server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Blockbench is built as a separate web application. Its internal links and
    # asset references are relative, so keeping it under this directory isolates
    # its runtime from the Pixcape React app.
    location = /blockbench {
        return 301 /blockbench/;
    }

    location ^~ /blockbench/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|otf|webmanifest|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
