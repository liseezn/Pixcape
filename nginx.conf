server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # AI API is a separate Compose service. Variable-based proxy_pass defers DNS lookup\n    # until requests arrive, so the frontend container can still start without that service.\n    location ^~ /api/ai/ {\n        resolver 127.0.0.11 valid=10s ipv6=off;\n        set $ai_api_host ai-api;\n        proxy_pass http://$ai_api_host:8787/api/ai/;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_read_timeout 180s;\n        client_max_body_size 12m;\n    }\n\n    # Blockbench is built as a separate web application. Its internal links and
    # asset references are relative, so keeping it under this directory isolates
    # its runtime from the Pixcape React app.
    location = /blockbench {
        return 301 /blockbench/;
    }

    location ^~ /blockbench/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|otf|webmanifest|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
