name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Install and test AI API
        run: npm --prefix ai-api install && npm --prefix ai-api test
      - name: Build AI API container
        run: docker build --tag pixcape-ai-api-test ./ai-api
      - name: Build complete Pixcape image including Blockbench
        run: docker build --tag pixcape-integration-test .
