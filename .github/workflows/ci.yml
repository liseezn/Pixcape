name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pixcape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pixcape"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: pixcape
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uci -pci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
      - run: npm install
      - name: Run unit tests
        run: npm run test:unit
      - name: Migrate PostgreSQL and run RBAC, ownership, bootstrap and rate-limit integration tests
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pixcape?schema=public
        run: npm run db:generate && npm run db:migrate && npm run test:integration
      - name: Migrate MySQL and run atomic rate-limit integration tests
        env:
          DATABASE_PROVIDER: mysql
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/pixcape
        run: npm run db:generate && npm run db:migrate && npm run test:mysql-rate-limit
      - name: Migrate SQLite and run atomic rate-limit integration tests
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:/tmp/pixcape-ci.db
        run: npm run db:generate && npm run db:migrate && npm run test:sqlite-rate-limit
      - name: Report high and critical dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const audit = require('/tmp/npm-audit.json')
          console.log('Dependency audit summary:', audit.metadata?.vulnerabilities)
          for (const [name, issue] of Object.entries(audit.vulnerabilities || {})) {
            if (['high', 'critical'].includes(issue.severity)) {
              console.log(JSON.stringify({
                name,
                severity: issue.severity,
                fixAvailable: issue.fixAvailable,
                via: issue.via.map(item => typeof item === 'string' ? item : item.title),
              }))
            }
          }
          NODE
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Install and test AI API
        run: npm --prefix ai-api install && npm --prefix ai-api test
      - name: Build AI API container
        run: docker build --tag pixcape-ai-api-test ./ai-api
      - name: Build complete Pixcape image including all database clients
        run: docker build --tag pixcape-integration-test .
      - name: Smoke-test the single image with a real SQLite migration
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pixcape-smoke \
            -p 18080:80 \
            -e NODE_ENV=production \
            -e DATABASE_PROVIDER=sqlite \
            -e DATABASE_URL=file:/data/pixcape.db \
            -e NEXTAUTH_SECRET=ci-smoke-secret-not-for-production-0123456789 \
            -e NEXTAUTH_URL=http://127.0.0.1:18080 \
            pixcape-integration-test
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs pixcape-smoke || true; fi
            docker rm -f pixcape-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/login >/dev/null && curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          docker exec pixcape-smoke test -s /data/pixcape.db
          docker exec pixcape-smoke node -e "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          E2E_BASE_URL=http://127.0.0.1:18080 npm run test:e2e
          echo "Single-image SQLite migration, HTTP and security E2E tests passed."
