name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Build complete Pixcape image including Blockbench
        run: docker build --tag pixcape-integration-test .
