name: Next.js Preview Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'prisma/**'
      - 'next.config.ts'
      - 'tsconfig.next.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/next-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build Next.js App Router preview
        run: npm run next:build
