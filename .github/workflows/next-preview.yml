name: Next.js Preview Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'auth.ts'
      - 'lib/**'
      - 'prisma/**'
      - 'next.config.ts'
      - 'tsconfig.next.json'
      - 'package.json'
      - 'docs/NEXTJS-USER-ROLES-MIGRATION.md'
      - '.github/workflows/next-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
      - run: npm install
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pixcape?schema=public
      - name: Build Next.js App Router preview
        run: npm run next:build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pixcape?schema=public
